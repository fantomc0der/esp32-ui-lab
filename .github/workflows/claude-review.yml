name: Claude PR Review

# The review half of the PR automation. See docs/pr-automation.md for the whole picture.
#
# Two jobs, in order:
#   review          - Claude reviews the diff and votes. Its pass/fail IS the gate,
#                     because `review` is a required status check on main.
#   arm-auto-merge  - only reachable when `review` succeeded; flips GitHub's own
#                     auto-merge switch on the PR. It decides nothing.
#
# Everything that would otherwise be a hand-written gate (are all checks green, is
# the head still current, is it a draft, is it still open) is left to GitHub's
# native auto-merge, which already enforces the ruleset on main.

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

# One review at a time per PR, and the newest push wins. Without this, two pushes
# a minute apart buy two full reviews that race to rewrite the same sticky comment,
# and the verdict the gate reads is whichever finished last rather than whichever
# looked at the current code. Keyed on the PR number so unrelated PRs still run in
# parallel.
#
# Cancelling is safe in both jobs. A cancelled `review` leaves its check red on a
# SHA that is no longer the head, which GitHub ignores, and the run that replaced
# it reports on the SHA that matters. A cancelled `arm-auto-merge` arms nothing,
# which is the correct outcome when the commit it was arming for has been
# superseded; the replacement run arms again, and that step is idempotent anyway.
concurrency:
  group: claude-review-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Named to sit alongside `scripts` and `firmware` in the ruleset's required checks.
    name: review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      # A draft has not been reviewed, so this check must not be green. Guarding the
      # whole job with `if: draft == false` looks tidier but publishes a `skipped`
      # conclusion, and GitHub counts `skipped` as satisfying a required check: the
      # PR reads CLEAN the instant it leaves draft, before any review has run on that
      # SHA. Failing instead keeps `review` red until a real review turns it green.
      #
      # The later steps carry the implicit success() guard, so this failing ends the
      # job; when the PR is not a draft this step is skipped and costs nothing.
      # `synchronize` fires on pushes to drafts too, so this is reached often rather
      # than only when a PR is opened.
      - name: Refuse to pass on a draft
        if: github.event.pull_request.draft == true
        run: |
          echo "::error::Draft PR, so nothing has reviewed this. Mark it ready for review."
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Pinned rather than tracking @v1. A review action that silently starts
      # failing takes the merge gate down with it, and this action has shipped at
      # least one release that broke on a whole class of repo layout (v1.0.89
      # crashed on any repo where CLAUDE.md or .claude/ is a git symlink, and
      # stayed broken for weeks). Bumping is a deliberate one-line change: read
      # the release notes, then move this pin.
      #
      # That particular bug cannot bite here, because this repo has no symlinks at
      # all (`git ls-files -s | grep 120000` is empty). Worth keeping that way:
      # it is also why .claude/skills/ holds real files rather than a symlink
      # pointing somewhere else in the tree.
      - uses: anthropics/claude-code-action@v1.0.183
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          base_branch: ${{ github.event.pull_request.base.ref }}
          # track_progress is required for use_sticky_comment to work alongside `prompt`.
          track_progress: true
          use_sticky_comment: true
          include_fix_links: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Read CLAUDE.md first — it records invariants that are not obvious from the diff, and most real defects in this repo are violations of one of them.

            The single most important thing to understand about this repo: CI cannot run the real functional test. `app/selftest.js` and `app/ui-selftest.js` execute on the physical ESP32-S3 panel and report over serial, so a hosted runner never runs them. CI proves that every board compiles, that scripts parse, and that scripts only call bindings the C layer registers. It proves nothing about runtime behaviour on the device. Weight your review accordingly: a change under `firmware/` is largely unverified by the checks that are about to go green, so scrutinise it far harder than a change under `tools/`.

            The `host-test` job narrows that gap without closing it. It compiles `jsvm_core.cpp` and the `lv`/`sys`/`fs` bindings against Arduino stubs and runs them under AddressSanitizer, so a use-after-free or a JSValue leak in those files is caught here. It has no panel, no touch, no real PSRAM or DMA and no input device, so the display flush path, the byte-order pairing, the capability flags and the event trampoline's coordinate path remain untested by any automated check. `docs/host-test.md` lists the limits; treat a claim that something is "covered" as needing to survive that list.

            Focus on:

            - **Correctness and regressions**, especially anything CI cannot catch.
            - **The invariants in CLAUDE.md.** In particular: the display flush swaps byte order exactly once (`lv_draw_sw_rgb565_swap()` paired with `draw16bitBeRGBBitmap()`); draw buffers size at 2 bytes/pixel explicitly and never `sizeof(lv_color_t)`; DMA buffers are `MALLOC_CAP_INTERNAL | MALLOC_CAP_DMA` because SPI DMA cannot reach PSRAM; one FreeRTOS task owns LVGL and the JS VM, so there is no locking and nothing else may touch LVGL; the touch transform is a measured plain transpose and must not be "corrected" from MADCTL rotation bits.
            - **JSValue ownership** in `firmware/lvgl-js-bindings/`: callbacks retained with `JS_DupValue` must be released exactly once, via an `LV_EVENT_DELETE` hook or `.stop()`. A leak or a double free here is the classic defect in this layer. Teardown order on reload is fixed: JS timers, then `lv_obj_clean(screen)`, then screen-level bindings, then the JS context, then the runtime.
            - **The platform/board seam.** `firmware/lvgl-js-bindings/` must not gain pin numbers, a resolution, or a panel name, and policy about running scripts belongs there rather than in a board sketch. Flag either direction of leakage.
            - **Generated files.** `app/apps/*.js`, `app/app.js` and `app/ui-selftest.js` are built from `app/src/*.jsx` and committed. A hand-edit to a generated file is a bug even when CI passes.
            - **Test coverage** for behaviour changes, given that on-hardware tests do not run in CI. A change to the binding layer that adds no case to `app/selftest.js` is worth flagging.
            - **Tests that cannot fail.** The tests are this repo's only defence, so an assertion that passes for a reason other than the one it claims is a defect in the deliverable even when nothing that ships is wrong. Ask of every new or changed assertion: what one-line change to the code under test would make this fail? If the answer is "none", or if it is not the behaviour the test's name and comments describe, flag it. The shapes this repo has actually hit: asserting that a call did not throw, where the code ignores unrecognised input anyway; asserting a count of distinct results, which catches a dropped table entry but not two entries swapped; and a substring match that a longer value also satisfies.
            - **Docs prose is never hard-wrapped** — one continuous line per paragraph or list item.

            Use inline comments for specific code issues. Post exactly one top-level summary comment.

            Separate what blocks the merge from what does not, and say which is which. A finding blocks if it is a defect in code or in a test's ability to fail. Prose that is imprecise but not wrong, a naming preference, or a suggestion for future work does not block: say it, mark it non-blocking, and let the verdict turn on the rest. Deciding this needs the whole picture, so make the blocking/non-blocking call for each finding in your summary comment, where you can see them together, rather than per inline comment.

            State each finding as something that can be checked, not as a prediction dressed as a fact. If you assert that a specific edit leaves the suite green, or that a value comes out as N, you are claiming a result — say what you did to establish it (read the code path, ran it, reasoned from a table in the diff), or phrase it as the question it really is. A confidently wrong finding costs more than a hedged one, because it sends the author to verify a claim that was never true. If the author comes back with a measurement that contradicts you, that settles it: acknowledge it and drop the finding.

            Aim to be exhaustive on the first pass. Re-reviews on later pushes should find things that were introduced or that you got wrong, not things you could have raised earlier — a long tail of rounds each surfacing one smaller item is a failure of the first pass, and the cost of it is real.

            The final line of your summary comment MUST be one of these verdicts, on its own line, with no surrounding punctuation or formatting:
            - `REVIEW: PASS` — the PR is ready to merge
            - `REVIEW: FAIL` — the PR needs changes before merge

            Be strict about defects. If you found a bug, an invariant violation, a test that cannot fail for its stated reason, or a behaviour change to the binding layer with no corresponding selftest case, vote FAIL. When genuinely torn on a firmware change, vote FAIL: nothing here ships to users, a wrong FAIL costs one more push, and a wrong PASS merges code no test on this runner can catch.

            Strict is not the same as withholding. If every blocking finding is resolved and what remains is non-blocking, vote PASS and keep the remarks — a PASS is not an endorsement of every line, and holding the gate shut over wording is how a review stops being useful. The verdict answers one question: is anything here wrong in a way that matters?
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

      # The action updates a sticky comment in place, so a FAIL verdict is otherwise
      # invisible to the merge gate — the check would go green simply because the
      # action did not error. This step is what turns the verdict into the job's
      # conclusion, and therefore into the required check that blocks the merge.
      #
      # Read only what `claude[bot]` wrote. This is the whole gate, so who authored
      # the text it trusts is load-bearing: on a public repo any GitHub user can
      # comment on an open PR, and scraping the last verdict-shaped string from any
      # author let a comment saying `REVIEW: PASS` override a bot that had voted
      # FAIL. `claude-fix.yml` posts as the PAT's own account rather than as the
      # app, so its summaries were indistinguishable from a human's here too.
      #
      # The REST endpoint is deliberate. `gh pr view --json comments` reports this
      # author as `claude` with no indication it is an app, while REST reports
      # `claude[bot]` with `type: Bot`. Only the latter is checkable: `[` is not a
      # legal character in a GitHub username, so no account can be created that
      # satisfies both halves of this filter.
      #
      # Anchoring the pattern to a whole line matches what the prompt above demands
      # (the verdict alone on the final line) and stops a verdict quoted mid-sentence
      # from being read as the verdict. `--paginate` streams bodies in order and the
      # aggregation is left to `tail`, because a `last` inside --jq would be applied
      # per page rather than across all of them.
      - name: Reflect verdict as job status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          verdict=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq '.[] | select(.user.type == "Bot" and .user.login == "claude[bot]") | .body' \
            | tr -d '\r' | grep -oE '^REVIEW: (PASS|FAIL)$' | tail -1 || echo "")
          echo "Claude verdict: ${verdict:-(none)}"
          if [ "$verdict" = "REVIEW: PASS" ]; then
            exit 0
          fi
          if [ "$verdict" = "REVIEW: FAIL" ]; then
            echo "::error::Claude voted REVIEW: FAIL — see the review comment for details."
            exit 1
          fi
          # No verdict is not a third outcome to interpret — it means the review did
          # not happen, so the gate stays red. Worth distinguishing from a FAIL when
          # reading it later: the action updates its sticky comment in place, so a
          # crash overwrites the previous verdict and leaves nothing for the scrape
          # above to find. That looks identical to a review that never ran, and it is
          # not recoverable by re-running alone once the comment is gone. A run that
          # ends in seconds having spent nothing never reached the model at all
          # (exhausted token budget or an API-side failure); a run that ends after
          # many turns crashed mid-review.
          #
          # One more way to land here, which the log will not explain: the review
          # commented under some identity other than `claude[bot]` and the filter
          # above discarded it. If the verdict is plainly visible on the PR and this
          # step still reports none, check the comment's author before anything else.
          echo "::error::No verdict from claude[bot], so this PR is unreviewed. Check the action log rather than the PR comment: if the run was short and free, the review never started. If a verdict is visible on the PR, check who authored it."
          exit 1

  arm-auto-merge:
    name: arm auto-merge
    needs: review
    # Explicit rather than relying on the implicit success() that `needs` provides,
    # because it also states the draft case: a draft fails `review` above, so this
    # resolves to 'failure' and the merge is never armed.
    if: needs.review.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable auto-merge
        env:
          # Deliberately the PAT and not GITHUB_TOKEN. GitHub performs the merge
          # later as whoever armed it, and a push to main authored by
          # github-actions[bot] does not trigger workflows — ci.yml would never run
          # on main again.
          GH_TOKEN: ${{ secrets.PR_AUTOMATION_PAT }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          armed=$(gh pr view "$PR" --repo "$REPO" --json autoMergeRequest --jq '.autoMergeRequest // empty')
          if [ -n "$armed" ]; then
            echo "Auto-merge is already enabled on this PR; nothing to do."
            exit 0
          fi
          # This does not merge anything. It sets a flag, and GitHub merges once its
          # own conditions hold: every required check green on the head SHA, not a
          # draft, and the branch up to date with main (the ruleset is strict).
          gh pr merge "$PR" --repo "$REPO" --squash --auto
          echo "Auto-merge armed. GitHub will squash once the ruleset on main is satisfied."
