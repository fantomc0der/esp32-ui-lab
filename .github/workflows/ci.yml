name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# What CI can and cannot do here. app/selftest.js remains the acceptance test and
# runs on the board over serial, so a hosted runner cannot execute it — that needs
# a self-hosted runner with a board attached; see docs/build-and-deploy.md.
#
# Short of that, three jobs: `scripts` checks everything about the JavaScript that
# does not need a device, `firmware` proves every board still compiles, and
# `host-test` compiles the binding layer for the runner and runs it under
# AddressSanitizer, which is what catches the memory bugs that used to wait for
# somebody to flash a board (docs/host-test.md). Nothing here touches the panel,
# touch, PSRAM caps, SPI DMA or FreeRTOS behaviour.

env:
  FQBN: "esp32:esp32:esp32s3:PSRAM=opi,FlashSize=16M,PartitionScheme=app3M_fat9M_16MB,CDCOnBoot=cdc,FlashMode=qio,USBMode=hwcdc"

jobs:
  scripts:
    name: scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax-check every script
        run: |
          for f in $(find app -name '*.js'); do
            node --check "$f" || exit 1
            echo "ok  $f"
          done

      # Catches the failures that would otherwise only show up on the device:
      # a script calling a binding the C layer does not register, or calling a
      # widget method on a kind of widget that does not have it.
      - name: Check scripts against the binding surface
        run: node tools/check-js-api.mjs

      # That check reads its constraints out of the C and infers kinds from the
      # scripts, so both halves are worth testing on their own.
      - name: Test the binding-surface check
        run: node tools/test-check-js-api.mjs

      # The JSX transform and the component runtime are plain JavaScript, so
      # unlike the binding layer they can be tested properly without a board.
      - name: Test the JSX transform
        run: node tools/test-jsx.mjs

      - name: Test the component runtime
        run: node tools/test-ui.mjs

      # apps/vitals.js was rewritten from imperative lv calls to JSX. This runs
      # the frozen pre-port original and the built port against the same fake
      # `lv` and fails if they build different widgets — the part of "it behaves
      # the same" that does not need the panel.
      - name: Check the ported app against its original
        run: node tools/test-parity.mjs

      # app/apps/*.js is generated from app/src/*.jsx and committed, because it
      # is what the card holds. A source edit without a rebuild would otherwise
      # ship the old app.
      - name: Check the built apps match their sources
        run: node tools/build-app.mjs --check

      - name: Check relative links in docs
        run: |
          fail=0
          for f in $(git ls-files '*.md'); do
            dir=$(dirname "$f")
            for l in $(grep -o '](\([^)#]*\.\(md\|js\|ino\)\)[^)]*)' "$f" | sed 's/^](//; s/[)#].*$//'); do
              case "$l" in http*) continue;; esac
              target=$(realpath -m --relative-to=. "$dir/$l")
              if [ ! -f "$target" ]; then echo "broken: $f -> $l"; fail=1; fi
            done
          done
          exit $fail

  firmware:
    name: firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The esp32 core is a large download; without this the job spends most
      # of its time re-fetching a toolchain that never changes.
      - name: Cache Arduino cores and libraries
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: arduino-esp32-3.3.11-lvgl-9.5.0-gfx-1.6.7

      - name: Install arduino-cli
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          echo "$PWD/bin" >> "$GITHUB_PATH"

      - name: Install the core and libraries
        run: |
          # --overwrite because the cache restores a config from the previous
          # run, and a bare `config init` exits 1 when one already exists.
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          # Pinned to the versions the board is verified against; see BUILDING.md.
          arduino-cli core install esp32:esp32@3.3.11
          arduino-cli lib install "lvgl@9.5.0"
          arduino-cli lib install "GFX Library for Arduino@1.6.7"

      # Both vendored libraries live in firmware/ rather than in the libraries
      # directory, so they are passed explicitly. Looping over the boards means
      # a new one is covered by CI as soon as it exists.
      - name: Build every board
        run: |
          for board in firmware/boards/*/; do
            echo "--- $board"
            arduino-cli compile \
              --library firmware/quickjs-ng \
              --library firmware/lvgl-js-bindings \
              -b "$FQBN" "$board" || exit 1
          done

      # Frozen, but still built: it is the reference for the display and touch
      # bring-up, so it should not be allowed to rot silently.
      - name: Build the frozen C dashboard
        run: arduino-cli compile -b "$FQBN" experiments/c-dashboard/app

  # The one job that executes the C layer rather than only compiling it. It runs
  # the binding layer natively under AddressSanitizer and UndefinedBehaviorSanitizer,
  # against stubs for the Arduino surface, so a use-after-free or a leak in the
  # ownership rules fails here instead of on the next flash. Both of this repo's
  # historical use-after-frees are regression cases in it.
  #
  # This is not a hardware test and cannot become one: no panel, no touch, no real
  # PSRAM or DMA. See docs/host-test.md for exactly what it does and does not prove.
  host-test:
    name: host-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      # The cached lvgl-subbuild carries a CMakeCache.txt stamped with this
      # runner's CMake version, and a stale one makes the build fail rather than
      # pass wrongly. Putting the version in the cache key turns that red job into
      # a cache miss instead.
      - name: Record the CMake version for the cache key
        id: cmakever
        run: echo "v=$(cmake --version | head -1 | tr -d ' .')" >> "$GITHUB_OUTPUT"

      # Cache the LVGL clone, skipping the ~900 object files in _deps/lvgl-build:
      # those are rebuilt from scratch anyway (a restored build tree has no
      # .ninja_log, so Ninja treats every output as dirty), and caching stale
      # objects next to an empty dependency log is how a cache starts producing
      # false greens rather than speed.
      #
      # lvgl-subbuild has to be in here alongside lvgl-src. It holds FetchContent's
      # stamp files, and without them CMake's generated gitclone.cmake starts with
      # an unconditional `rm -rf "<SOURCE_DIR>"` — so caching lvgl-src on its own
      # is worse than useless: the restored tree is deleted and re-cloned, with the
      # cache step still reporting a hit. Verified by restoring lvgl-src alone with
      # a marker file in it and watching the marker disappear.
      #
      # Keyed on CMakeLists.txt because that is what holds GIT_TAG, and so what
      # decides the clone's contents. Deliberately *not* keyed on either lv_conf.h:
      # nothing cached here is compiled, LV_CONF_PATH is a cache variable of the
      # outer build whose objects are not cached, so hashing them would buy nothing
      # and cost a full re-clone on every edit to a file this target expects to be
      # edited.
      - name: Cache the LVGL clone
        uses: actions/cache@v4
        with:
          path: |
            firmware/host-test/.build/_deps/lvgl-src
            firmware/host-test/.build/_deps/lvgl-subbuild
          key: host-test-lvgl-9.5.0-${{ steps.cmakever.outputs.v }}-${{ hashFiles('firmware/host-test/CMakeLists.txt') }}

      - name: Configure
        run: cmake -S firmware/host-test -B firmware/host-test/.build -G Ninja

      - name: Build
        run: cmake --build firmware/host-test/.build -j

      # --output-on-failure so a sanitizer report reaches the log: the stack
      # trace is the whole value of the job when something breaks.
      - name: Run the suites under ASan
        run: ctest --test-dir firmware/host-test/.build --output-on-failure
