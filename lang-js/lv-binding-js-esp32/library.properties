name=lv-binding-js-esp32
version=1.0.0
author=fantomc0der
maintainer=fantomc0der
sentence=Script an LVGL 9 UI in JavaScript on the ESP32, using an embedded QuickJS-ng engine.
paragraph=Exposes a curated LVGL surface (widgets, props, events, timers) plus sys/wifi/console to scripts loaded at runtime, so the UI is editable data instead of firmware. Board-agnostic: all hardware specifics reach it through three host hooks. Requires the quickjs-ng library that ships alongside it. Not affiliated with lvgl/lv_binding_js.
