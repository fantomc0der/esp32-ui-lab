name: Claude PR Fix

# On-demand, and the only piece of this automation a human triggers directly:
# comment `@claude <what to change>` on a PR and Claude pushes the change to the
# branch. The push is authored by the PAT, so it fires `synchronize`, which
# re-runs both ci.yml and the review — the fix is re-gated like any other commit.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# Two `@claude` comments in quick succession would otherwise start two runs that
# check out the same branch and both try to push to it, where the loser fails on a
# non-fast-forward after having already paid for its turns. Queued rather than
# cancelled: unlike a review, a fix run has side effects, and cancelling one
# partway through can leave a commit pushed with the work half done.
concurrency:
  group: claude-fix-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  fix:
    # Only PR comments containing @claude, and never a comment written by a bot.
    # The bot exclusion is the loop guard: the review posts its sticky comment as
    # github-actions[bot], and without this a review that happened to quote
    # "@claude" would trigger a fix, whose push would trigger another review.
    if: |
      github.event.comment.user.type != 'Bot' &&
      ((github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null && contains(github.event.comment.body, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          # The PAT rather than GITHUB_TOKEN so the resulting push triggers the
          # review workflow. A push authored by GITHUB_TOKEN does not.
          token: ${{ secrets.PR_AUTOMATION_PAT }}
      # Keep this pin in step with claude-review.yml; the reasoning is recorded there.
      - uses: anthropics/claude-code-action@v1.0.183
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.PR_AUTOMATION_PAT }}
          base_branch: ${{ github.event.pull_request.base.ref }}
